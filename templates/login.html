<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AltVault - Login</title><style>body { font-family: Arial; background: #0b0e14; color: #fff; text-align: center; padding-top: 100px; } .box { max-width: 350px; margin: 0 auto; background: #111622; padding: 30px; border-radius: 8px; } input { width: 100%; box-sizing: border-box; padding: 10px; margin: 10px 0; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 4px; } button { width: 100%; padding: 12px; background: #a855f7; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }</style></head>
<body>
    <div class="box">
        <h2>🔒 Sign In</h2>
        {% if error %}<p style="color:#ef4444;">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="margin-top:15px; font-size:14px; color:#64748b;">New? <a href="/register" style="color:#a855f7;">Create an account</a></p>
    </div>
</body>
</html>
