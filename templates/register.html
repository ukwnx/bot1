<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AltVault - Register</title><style>body { font-family: Arial; background: #0b0e14; color: #fff; text-align: center; padding-top: 100px; } .box { max-width: 350px; margin: 0 auto; background: #111622; padding: 30px; border-radius: 8px; } input { width: 100%; box-sizing: border-box; padding: 10px; margin: 10px 0; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 4px; } button { width: 100%; padding: 12px; background: #3b82f6; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }</style></head>
<body>
    <div class="box">
        <h2>📝 Register Account</h2>
        {% if error %}<p style="color:#ef4444;">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Choose Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Choose Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p style="margin-top:15px; font-size:14px; color:#64748b;">Have an account? <a href="/login" style="color:#3b82f6;">Login here</a></p>
    </div>
</body>
</html>
